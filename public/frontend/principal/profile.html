<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Profile - DBASC IT SUPPORT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/frontend/assets/css/style.css?v=college-logo-18" rel="stylesheet">
  </head>
  <body>
    <div class="topbar"><div class="container-fluid d-flex align-items-center"><h5 class="text-white mb-0">My Profile</h5></div></div>
    <div class="sidebar"></div>
    <main class="content container-fluid">
      <div class="network-hero page-header">
        <div>
          <span class="network-eyebrow"><span class="user-dot"></span> PRINCIPAL / ACCOUNT</span>
          <h2>My Profile</h2>
          <p>Your account and contact information.</p>
        </div>
        <span class="badge-soft-primary"><i class="bi bi-person"></i> Principal profile</span>
      </div>
      <section class="card p-4">
        <h5>Account information</h5>
        <div class="row g-3 mt-1">
          <div class="col-md-6"><span class="text-muted d-block">Full name</span><strong id="profile-name">—</strong></div>
          <div class="col-md-6"><span class="text-muted d-block">Email</span><strong id="profile-email">—</strong></div>
          <div class="col-md-6"><span class="text-muted d-block">Role</span><strong>Principal</strong></div>
        </div>
        <p class="text-muted mt-4 mb-0">Profile editing is not available in this page layout.</p>
      </section>
    </main>
    <script src="/frontend/assets/js/auth.js?v=role-pages-2"></script>
    <script>
      const session = DBASCAuth.getSession()
      if (session) {
        document.getElementById('profile-name').textContent = session.name || '—'
        document.getElementById('profile-email').textContent = session.email || '—'
      }
    </script>
    <script src="/frontend/assets/js/logo.js?v=1"></script>
  </body>
</html>
