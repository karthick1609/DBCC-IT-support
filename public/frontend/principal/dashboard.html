<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Principal Dashboard - DBASC IT SUPPORT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/frontend/assets/css/style.css" rel="stylesheet">
  </head>
  <body>
    <div class="topbar"><div class="container-fluid d-flex align-items-center"><h5 class="text-white mb-0">Principal Dashboard</h5></div></div>
    <div class="sidebar"></div>
    <div class="content container-fluid">
      <h3>IT Management Overview</h3>
      <div class="row g-3">
        <div class="col-md-3"><div class="card p-3">Total Assets<br><strong>328</strong></div></div>
        <div class="col-md-3"><div class="card p-3">Total Tickets<br><strong>254</strong></div></div>
        <div class="col-md-3"><div class="card p-3">Open Tickets<br><strong>14</strong></div></div>
        <div class="col-md-3"><div class="card p-3">Resolved<br><strong>126</strong></div></div>
      </div>
      <div class="row mt-4">
        <div class="col-lg-6"><div class="card p-3"><canvas id="chartAssets"></canvas></div></div>
        <div class="col-lg-6"><div class="card p-3"><canvas id="chartDept"></canvas></div></div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
      const ctxA = document.getElementById('chartAssets').getContext('2d')
      new Chart(ctxA, {type:'doughnut',data:{labels:['Desktop','Laptop','Server','Printer'],datasets:[{data:[120,80,10,40],backgroundColor:['#0d6efd','#6610f2','#6f42c1','#fd7e14']}]}})
      const ctxD = document.getElementById('chartDept').getContext('2d')
      new Chart(ctxD, {type:'bar',data:{labels:['BCA','B.Com','Viscom','Admin','Library'],datasets:[{label:'Tickets',data:[40,30,20,10,15],backgroundColor:'#0d6efd'}]}})
    </script>
  </body>
  </html>
