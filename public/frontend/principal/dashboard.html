<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Principal Dashboard - DBASC IT SUPPORT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/frontend/assets/css/style.css?v=college-logo-17" rel="stylesheet">
  </head>
  <body>
    <div class="topbar"><div class="container-fluid d-flex align-items-center"><h5 class="text-white mb-0">Principal Dashboard</h5></div></div>
    <div class="sidebar"></div>
    <div class="content">
      <div class="network-hero page-header">
        <div>
          <span class="network-eyebrow"><span class="user-dot"></span> IT OPERATIONS / EXECUTIVE OVERVIEW</span>
          <h2>IT Management Overview</h2>
          <p>Track service health and technology resources at a glance.</p>
        </div>
        <span class="badge-soft-primary"><i class="bi bi-diagram-3"></i> Live overview</span>
      </div>
      <div class="card-stats">
        <div class="card p-3"><h6><i class="bi bi-pc-display-horizontal"></i> Total Assets</h6><h3 id="principal-assets">—</h3></div>
        <div class="card p-3"><h6><i class="bi bi-ticket-detailed"></i> Total Tickets</h6><h3 id="principal-tickets">—</h3></div>
        <div class="card p-3"><h6><i class="bi bi-broadcast-pin"></i> Open Tickets</h6><h3 id="principal-open">—</h3></div>
        <div class="card p-3"><h6><i class="bi bi-check2-circle"></i> Resolved</h6><h3 id="principal-resolved">—</h3></div>
      </div>
      <div id="dashboard-error" class="alert alert-danger d-none mt-3" role="alert"></div>
      <div class="row mt-4">
        <div class="col-lg-6"><div class="card p-3 chart-panel"><h5>Asset inventory</h5><canvas id="chartAssets"></canvas></div></div>
        <div class="col-lg-6"><div class="card p-3 chart-panel"><h5>Tickets by department</h5><canvas id="chartDept"></canvas></div></div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="/frontend/assets/js/auth.js"></script>
    <script>
      Promise.all([
        DBASCAuth.authorizedFetch('/api/reports?type=dashboard-summary').then(async r=>{const d=await r.json();if(!r.ok||!d.success)throw new Error(d.message||'Unable to load summary.');return d.data}),
        DBASCAuth.authorizedFetch('/api/reports?type=tickets-by-department').then(async r=>{const d=await r.json();if(!r.ok||!d.success)throw new Error(d.message||'Unable to load departments.');return d.data})
      ]).then(([summary,departments])=>{
        document.getElementById('principal-assets').textContent=summary.assets_total
        document.getElementById('principal-tickets').textContent=summary.tickets_total
        document.getElementById('principal-open').textContent=summary.tickets_by_status.Open||0
        document.getElementById('principal-resolved').textContent=summary.tickets_by_status.Resolved||0
        const styles=getComputedStyle(document.body)
        const primary=styles.getPropertyValue('--primary').trim()
        const panel=styles.getPropertyValue('--panel').trim()
        const text=styles.getPropertyValue('--text').trim()
        const muted=styles.getPropertyValue('--muted').trim()
        const line=styles.getPropertyValue('--line').trim()
        const axes={ticks:{color:muted},grid:{color:line}}
        new Chart(document.getElementById('chartAssets'),{type:'doughnut',data:{labels:['Assets'],datasets:[{data:[summary.assets_total],backgroundColor:[primary],borderColor:panel,borderWidth:4}]},options:{maintainAspectRatio:false,plugins:{legend:{labels:{color:text}}}}})
        new Chart(document.getElementById('chartDept'),{type:'bar',data:{labels:departments.map(d=>d.department_name),datasets:[{label:'Tickets',data:departments.map(d=>d.count),backgroundColor:primary,borderRadius:6}]},options:{maintainAspectRatio:false,plugins:{legend:{labels:{color:text}}},scales:{x:axes,y:Object.assign({},axes,{beginAtZero:true})}}})
      }).catch(error=>{
        const box=document.getElementById('dashboard-error')
        box.textContent=error.message
        box.classList.remove('d-none')
      })
    </script>
    <script src="/frontend/assets/js/logo.js?v=1"></script>
  </body>
  </html>
