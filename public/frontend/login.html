<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DBASC IT SUPPORT - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/frontend/assets/css/style.css?v=college-logo-17" rel="stylesheet">
  </head>
  <body class="auth-page auth-login-page">
    <main class="auth-login-shell">
      <section class="auth-card auth-login-card" aria-labelledby="login-title">
        <header class="login-brand">
          <h1>DBASC IT SUPPORT</h1>
          <p>Asset &amp; Help Desk Management</p>
        </header>
        <div class="auth-card-body login-form-body">
          <p class="login-intro">Sign in to access your IT support dashboard.</p>
          <form id="login-form">
            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input id="email" type="email" class="form-control" placeholder="you@example.com" autocomplete="email" required>
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input id="password" type="password" class="form-control" placeholder="Enter password" autocomplete="current-password" required>
            </div>
            <div id="login-error" class="alert alert-danger d-none" role="alert"></div>
            <button type="submit" class="btn btn-primary w-100">Login</button>
          </form>
          <button id="show-forgot-password" class="forgot-password-link" type="button">Forgot password?</button>
          <form id="forgot-password-form" class="d-none">
            <p class="login-intro">Enter your account email and we’ll send you a password reset link.</p>
            <div class="mb-3">
              <label for="recovery-email" class="form-label">Email</label>
              <input id="recovery-email" type="email" class="form-control" placeholder="you@example.com" autocomplete="email" required>
            </div>
            <div id="recovery-message" class="alert d-none" role="alert"></div>
            <button type="submit" class="btn btn-primary w-100">Send reset link</button>
            <button id="back-to-login" class="back-to-login" type="button">Back to login</button>
          </form>
          <p class="login-register-link">New user? <a href="/frontend/register.html">Create an account</a></p>
        </div>
      </section>
    </main>

    <script src="/frontend/assets/js/auth.js"></script>
    <script src="/frontend/assets/js/logo.js?v=1"></script>
  </body>
</html>
