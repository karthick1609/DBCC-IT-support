<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DBASC IT SUPPORT - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      body {
        margin: 0;
        font-family: Inter, "Segoe UI", sans-serif;
        background: radial-gradient(circle at top left, rgba(59, 130, 246, 0.15), transparent 32%),
          linear-gradient(135deg, #eef6ff 0%, #eaf3ff 35%, #f7fbff 100%);
        min-height: 100vh;
      }
      .login-shell {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 30px 20px;
      }
      .login-card {
        width: min(100%, 460px);
        border: 1px solid rgba(148, 163, 184, 0.25);
        border-radius: 22px;
        background: rgba(255,255,255,0.82);
        backdrop-filter: blur(10px);
        box-shadow: 0 22px 55px rgba(15, 23, 42, 0.12);
        overflow: hidden;
      }
      .brand-strip {
        background: linear-gradient(135deg, #1d4ed8, #2563eb 50%, #60a5fa);
        padding: 22px 28px;
        color: white;
      }
      .brand-strip h2 {
        margin: 0;
        font-weight: 800;
        letter-spacing: 0.03em;
      }
      .brand-strip small {
        opacity: 0.9;
      }
      .card-body {
        padding: 28px 30px 24px;
      }
      .form-control {
        border-radius: 12px;
        border: 1px solid #d5deee;
        padding: 0.8rem 0.9rem;
      }
      .form-control:focus {
        border-color: #60a5fa;
        box-shadow: 0 0 0 0.2rem rgba(96, 165, 250, 0.18);
      }
      .btn-primary {
        border: none;
        border-radius: 12px;
        padding: 0.8rem 1rem;
        font-weight: 700;
        background: linear-gradient(135deg, #1d4ed8, #2563eb);
      }
      .demo-box {
        background: #f8fbff;
        border: 1px solid #dfeafc;
        border-radius: 14px;
        padding: 14px 16px;
        color: #475569;
      }
      .demo-box strong {
        color: #0f172a;
      }
      @media (max-width: 480px) {
        .card-body { padding: 24px 20px; }
      }
    </style>
  </head>
  <body>
    <div class="login-shell">
      <div class="login-card">
        <div class="brand-strip">
          <h2>DBASC IT SUPPORT</h2>
          <small>Asset & Help Desk Management</small>
        </div>

        <div class="card-body">
          <p class="text-muted mb-4">Sign in to access your IT support dashboard.</p>

          <form id="login-form">
            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input id="email" type="email" class="form-control" placeholder="admin@example.com" required>
            </div>

            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input id="password" type="password" class="form-control" placeholder="Enter password" required>
            </div>

            <div id="login-error" class="alert alert-danger d-none" role="alert"></div>

            <button type="submit" class="btn btn-primary w-100">Login</button>
          </form>

          <div class="demo-box mt-4 small">
            <div><strong>Demo accounts</strong></div>
            <div>Admin: admin@example.com / Admin@123</div>
            <div>Staff: staff@example.com / Staff@123</div>
            <div>Principal: principal@example.com / Principal@123</div>
          </div>
        </div>
      </div>
    </div>

    <script src="/frontend/assets/js/auth.js"></script>
  </body>
</html>
