<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Import Assets CSV - DBASC IT SUPPORT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/frontend/assets/css/style.css" rel="stylesheet">
  </head>
  <body>
    <div class="topbar"><div class="container-fluid d-flex align-items-center"><h5 class="text-white mb-0">Import Assets</h5></div></div>
    <div class="sidebar"></div>
    <div class="content container-fluid">
      <div class="card p-3">
        <h5>Upload CSV</h5>
        <input id="csvFile" type="file" accept=".csv" class="form-control mb-3">
        <div id="preview" class="mt-3"></div>
        <div class="d-flex justify-content-end mt-3"><button class="btn btn-primary" id="importBtn">Import</button></div>
      </div>
    </div>
    <script>
      document.getElementById('csvFile').addEventListener('change', async (e)=>{
        const f = e.target.files[0]
        if(!f) return
        const txt = await f.text()
        const rows = txt.split('\n').slice(0,6)
        document.getElementById('preview').innerHTML = `<pre>${rows.join('\n')}</pre>`
      })
      document.getElementById('importBtn').addEventListener('click', ()=>alert('Import simulated.'))
    </script>
  </body>
  </html>
