<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Import Assets CSV - DBASC IT SUPPORT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/frontend/assets/css/style.css?v=college-logo-18" rel="stylesheet">
  </head>
  <body>
    <div class="topbar"><div class="container-fluid d-flex align-items-center"><h5 class="text-white mb-0">Import Assets</h5></div></div>
    <div class="sidebar"></div>
    <div class="content container-fluid">
      <div class="card p-3">
        <h5>Upload CSV</h5>
        <input id="csvFile" type="file" accept=".csv" class="form-control mb-3">
        <div id="preview" class="mt-3"></div>
        <div id="import-message" class="alert d-none" role="alert"></div>
        <div class="d-flex justify-content-end mt-3"><button class="btn btn-primary" id="importBtn" disabled>Import</button></div>
      </div>
    </div>
    <script src="/frontend/assets/js/auth.js?v=role-pages-2"></script>
    <script>
      let csvText = ''
      const fileInput = document.getElementById('csvFile')
      const preview = document.getElementById('preview')
      const button = document.getElementById('importBtn')
      const message = document.getElementById('import-message')
      document.getElementById('csvFile').addEventListener('change', async (e)=>{
        const f = e.target.files[0]
        csvText = ''
        button.disabled = true
        message.classList.add('d-none')
        if(!f) return
        if(f.size > 5 * 1024 * 1024) {
          message.textContent = 'CSV exceeds the 5 MB limit.'
          message.className = 'alert alert-danger'
          return
        }
        try {
          csvText = await f.text()
          const pre = document.createElement('pre')
          pre.textContent = csvText.split(/\r?\n/).slice(0,6).join('\n')
          preview.replaceChildren(pre)
          button.disabled = !csvText.trim()
        } catch(error) {
          message.textContent = 'Unable to read the selected CSV file.'
          message.className = 'alert alert-danger'
        }
      })
      button.addEventListener('click', async ()=>{
        button.disabled = true
        message.classList.add('d-none')
        try {
          const response = await DBASCAuth.authorizedFetch('/api/assets/import', {
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({csv_text:csvText})
          })
          const result=await response.json()
          if(!response.ok||!result.success) throw new Error(result.message||'CSV import failed.')
          const summary=result.summary
          message.textContent=`Imported ${summary.imported} of ${summary.total} assets; ${summary.failed} failed.`
          message.className=summary.failed ? 'alert alert-warning' : 'alert alert-success'
          if(result.failures && result.failures.length) {
            const list=document.createElement('ul')
            result.failures.forEach(failure=>{
              const item=document.createElement('li')
              item.textContent=`Row ${failure.row_number}: ${failure.reason}`
              list.append(item)
            })
            message.append(list)
          }
          message.classList.remove('d-none')
        } catch(error) {
          message.textContent=error.message
          message.className='alert alert-danger'
        } finally {
          button.disabled=!csvText
        }
      })
    </script>
    <script src="/frontend/assets/js/logo.js?v=1"></script>
  </body>
  </html>
