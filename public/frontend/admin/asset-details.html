<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Asset Details - DBASC IT SUPPORT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/frontend/assets/css/style.css" rel="stylesheet">
  </head>
  <body>
    <div class="topbar"><div class="container-fluid d-flex align-items-center"><h5 class="text-white mb-0">Asset Details</h5></div></div>
    <div class="sidebar"></div>
    <div class="content container-fluid">
      <div class="row">
        <div class="col-md-8">
          <div class="card p-3 mb-3">
            <div class="d-flex justify-content-between">
              <h4 id="asset-id">DB-PC-0001</h4>
              <div><button class="btn btn-outline-secondary">Download QR</button></div>
            </div>
            <p id="asset-name">Desktop 1</p>
            <div class="row">
              <div class="col-md-6"><h6>Hardware</h6><p id="hardware">Intel i5, 8GB RAM, 256GB SSD</p></div>
              <div class="col-md-6"><h6>Network</h6><p id="network">Hostname: pc-001<br>IP: 192.168.1.10</p></div>
            </div>
          </div>

          <div class="card p-3">
            <h5>Asset History</h5>
            <div class="timeline mt-3">
              <div><small class="text-muted">07 Oct 2026</small><div>Asset assigned to BCA Lab</div></div>
              <div class="mt-2"><small class="text-muted">05 Oct 2026</small><div>Location changed to Lab 1</div></div>
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card p-3 mb-3 text-center">
            <img src="/frontend/assets/images/asset-placeholder.png" width="100%" alt="asset">
            <h6 class="mt-2">Status: <span class="badge bg-success">Active</span></h6>
          </div>
          <div class="card p-3">
            <h6>QR Code</h6>
            <div id="qr-code"><img src="https://via.placeholder.com/200" alt="qr"></div>
          </div>
        </div>
      </div>
    </div>

  </body>
  </html>
