<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tickets - DBASC IT SUPPORT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/1.13.5/css/jquery.dataTables.min.css" rel="stylesheet">
    <link href="/frontend/assets/css/style.css" rel="stylesheet">
  </head>
  <body>
    <div class="topbar"><div class="container-fluid d-flex align-items-center"><h5 class="text-white mb-0">Tickets</h5></div></div>
    <div class="sidebar"></div>
    <div class="content container-fluid">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>Help Desk Tickets</h3>
        <div>
          <a class="btn btn-primary" href="/frontend/staff/create-ticket.html">Create Ticket</a>
        </div>
      </div>

      <table id="tickets-table" class="table table-striped" style="width:100%">
        <thead><tr><th>Ticket ID</th><th>Title</th><th>Requester</th><th>Dept</th><th>Category</th><th>Priority</th><th>Status</th><th>Assigned</th><th>Created</th><th>Actions</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.5/js/jquery.dataTables.min.js"></script>
    <script>
      const mockTickets = []
      for(let i=1;i<=15;i++) mockTickets.push({id:`DB-HD-${String(i).padStart(6,'0')}`,title:`Issue ${i}`,requester:`Staff ${i}`,department:'BCA',category:'Network',priority:['Low','Medium','High','Critical'][i%4],status:['Open','Assigned','In Progress','Resolved'][i%4],assigned:'Tech 1',created:'2026-10-0'+(i%9+1)})
      $(document).ready(()=>{ $('#tickets-table').DataTable({data:mockTickets,columns:[{data:'id'},{data:'title'},{data:'requester'},{data:'department'},{data:'category'},{data:'priority'},{data:'status'},{data:'assigned'},{data:'created'},{data:null,render:(d)=>`<a class='btn btn-sm btn-primary' href='/frontend/admin/ticket-details.html?id=${d.id}'>View</a>`}]}) })
    </script>
  </body>
  </html>
