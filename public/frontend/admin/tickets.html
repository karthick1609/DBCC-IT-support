<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tickets - DBASC IT SUPPORT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/1.13.5/css/jquery.dataTables.min.css" rel="stylesheet">
    <link href="/frontend/assets/css/style.css?v=college-logo-18" rel="stylesheet">
  </head>
  <body>
    <div class="topbar"><div class="container-fluid d-flex align-items-center"><h5 class="text-white mb-0">Tickets</h5></div></div>
    <div class="sidebar"></div>
    <div class="content container-fluid">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>Help Desk Tickets</h3>
      </div>

      <div id="tickets-message" class="alert d-none" role="status"></div>
      <div id="tickets-error" class="alert alert-danger d-none" role="alert"></div>
      <table id="tickets-table" class="table table-striped" style="width:100%">
        <thead><tr><th>Ticket ID</th><th>Title</th><th>Requester</th><th>Dept</th><th>Category</th><th>Priority</th><th>Status</th><th>Assigned</th><th>Created</th><th>Actions</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.5/js/jquery.dataTables.min.js"></script>
    <script src="/frontend/assets/js/auth.js?v=role-pages-2"></script>
    <script>
      $(document).ready(function(){
        const table = $('#tickets-table').DataTable({data:[],columns:[
          {data:'ticket_number'},
          {data:'title'},
          {data:'requester.full_name',defaultContent:'—'},
          {data:'departments.name',defaultContent:'—'},
          {data:'ticket_categories.name',defaultContent:'—'},
          {data:'priority'},
          {data:'status'},
          {data:null,render:()=> '—'},
          {data:'created_at'},
          {data:null,orderable:false,searchable:false,render:ticket=>{
            const view=`<a class="btn btn-sm btn-primary" href="/frontend/admin/ticket-details.html?id=${encodeURIComponent(ticket.id)}">View</a>`
            if(DBASCAuth.getSession()?.role!=='admin') return view
            const statusAction=ticket.status==='Open'
              ? `<button class="btn btn-sm btn-success ticket-status-action" data-id="${encodeURIComponent(ticket.id)}" data-status="In Progress" type="button">Accept</button>`
              : ticket.status==='In Progress'
                ? `<button class="btn btn-sm btn-outline-success ticket-status-action" data-id="${encodeURIComponent(ticket.id)}" data-status="Completed" type="button">Complete</button>`
                : ''
            return `<div class="d-flex flex-wrap gap-1">${view}${statusAction}</div>`
          }}
        ]})
        async function loadTickets() {
          const response=await DBASCAuth.authorizedFetch('/api/tickets')
            const result=await response.json()
            if(!response.ok||!result.success) throw new Error(result.message||'Unable to load tickets.')
            table.clear().rows.add(result.data||[]).draw()
        }
        loadTickets().catch(error=>{
            const box=document.getElementById('tickets-error')
            box.textContent=error.message
            box.classList.remove('d-none')
          })
        $('#tickets-table').on('click','.ticket-status-action',async function(){
          const button=this
          const message=document.getElementById('tickets-message')
          message.className='alert d-none'
          button.disabled=true
          try {
            const response=await DBASCAuth.authorizedFetch(`/api/tickets/${button.dataset.id}`,{
              method:'PUT',
              headers:{'Content-Type':'application/json'},
              body:JSON.stringify({status:button.dataset.status})
            })
            const result=await response.json()
            if(!response.ok||!result.success) throw new Error(result.message||'Unable to update ticket status.')
            message.textContent=`Ticket ${result.data.ticket_number} is now ${result.data.status}.`
            message.className='alert alert-success'
            await loadTickets()
          } catch(error) {
            message.textContent=error.message
            message.className='alert alert-danger'
          } finally {
            button.disabled=false
          }
        })
      })
    </script>
    <script src="/frontend/assets/js/logo.js?v=1"></script>
  </body>
  </html>
