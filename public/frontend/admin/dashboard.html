<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Dashboard - DBASC IT SUPPORT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/frontend/assets/css/style.css" rel="stylesheet">
  </head>
  <body>
    <div class="topbar"><div class="container-fluid d-flex align-items-center"><h5 class="text-white mb-0">Admin Dashboard</h5></div></div>
    <div class="sidebar"><ul class="nav flex-column"><li class="nav-item"><a class="nav-link" href="/frontend/index.html">Home</a></li></ul></div>
    <div class="content container-fluid">
      <div class="row">
        <div class="col-12">
          <h3>Overview</h3>
        </div>
      </div>
      <div class="row g-3">
        <div class="col-md-3"><div class="card p-3"><small>Total Assets</small><h4 id="assets-total">—</h4></div></div>
        <div class="col-md-3"><div class="card p-3"><small>Open Tickets</small><h4 id="tickets-open">—</h4></div></div>
        <div class="col-md-3"><div class="card p-3"><small>In Progress</small><h4 id="tickets-progress">—</h4></div></div>
        <div class="col-md-3"><div class="card p-3"><small>Resolved</small><h4 id="tickets-resolved">—</h4></div></div>
      </div>
      <div id="dashboard-error" class="alert alert-danger d-none mt-3" role="alert"></div>

      <div class="row mt-4">
        <div class="col-lg-6">
          <div class="card p-3">
            <canvas id="chartAssets"></canvas>
          </div>
        </div>
        <div class="col-lg-6">
          <div class="card p-3">
            <canvas id="chartTickets"></canvas>
          </div>
        </div>
      </div>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="/frontend/assets/js/auth.js"></script>
    <script>
      DBASCAuth.authorizedFetch('/api/reports?type=dashboard-summary')
        .then(async response=>{
          const result=await response.json()
          if(!response.ok||!result.success) throw new Error(result.message||'Unable to load dashboard.')
          const data=result.data
          document.getElementById('assets-total').textContent=data.assets_total
          const statuses=data.tickets_by_status
          document.getElementById('tickets-open').textContent=statuses.Open||0
          document.getElementById('tickets-progress').textContent=statuses['In Progress']||0
          document.getElementById('tickets-resolved').textContent=statuses.Resolved||0
          new Chart(document.getElementById('chartAssets'),{type:'doughnut',data:{labels:['Assets'],datasets:[{data:[data.assets_total],backgroundColor:['#0d6efd']}]}})
          new Chart(document.getElementById('chartTickets'),{type:'bar',data:{labels:Object.keys(statuses),datasets:[{label:'Tickets',data:Object.values(statuses),backgroundColor:'#0d6efd'}]}})
        })
        .catch(error=>{
          const box=document.getElementById('dashboard-error')
          box.textContent=error.message
          box.classList.remove('d-none')
        })
    </script>
  </body>
  </html>
