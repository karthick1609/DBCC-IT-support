<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Dashboard - DBASC IT SUPPORT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/frontend/assets/css/style.css" rel="stylesheet">
  </head>
  <body>
    <div class="topbar"><div class="container-fluid d-flex align-items-center"><h5 class="text-white mb-0">Admin Dashboard</h5></div></div>
    <div class="sidebar"><ul class="nav flex-column"><li class="nav-item"><a class="nav-link" href="/frontend/index.html">Home</a></li></ul></div>
    <div class="content container-fluid">
      <div class="row">
        <div class="col-12">
          <h3>Overview</h3>
        </div>
      </div>
      <div class="row g-3">
        <div class="col-md-3"><div class="card p-3"><small>Total Assets</small><h4>328</h4></div></div>
        <div class="col-md-3"><div class="card p-3"><small>Active</small><h4>310</h4></div></div>
        <div class="col-md-3"><div class="card p-3"><small>Under Repair</small><h4>8</h4></div></div>
        <div class="col-md-3"><div class="card p-3"><small>Retired</small><h4>10</h4></div></div>
      </div>

      <div class="row mt-4">
        <div class="col-lg-6">
          <div class="card p-3">
            <canvas id="chartAssets"></canvas>
          </div>
        </div>
        <div class="col-lg-6">
          <div class="card p-3">
            <canvas id="chartTickets"></canvas>
          </div>
        </div>
      </div>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
      const ctxA = document.getElementById('chartAssets').getContext('2d')
      new Chart(ctxA, {type:'pie',data:{labels:['Desktop','Laptop','Server','Switch','Router','UPS','Printer','Projector'],datasets:[{data:[120,80,10,20,10,5,40,5],backgroundColor:['#0d6efd','#6610f2','#6f42c1','#d63384','#fd7e14','#198754','#20c997','#0dcaf0']}]}})

      const ctxT = document.getElementById('chartTickets').getContext('2d')
      new Chart(ctxT, {type:'bar',data:{labels:['Open','Assigned','In Progress','Resolved','Closed'],datasets:[{label:'Tickets',data:[14,5,7,126,89],backgroundColor:['#dc3545','#ffc107','#0d6efd','#198754','#6c757d']}]}})
    </script>
  </body>
  </html>
