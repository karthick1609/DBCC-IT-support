<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Assets - DBASC IT SUPPORT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/1.13.5/css/jquery.dataTables.min.css" rel="stylesheet">
    <link href="/frontend/assets/css/style.css?v=college-logo-9" rel="stylesheet">
  </head>
  <body>
    <div class="topbar"><div class="container-fluid d-flex align-items-center"><h5 class="text-white mb-0">Assets</h5></div></div>
    <div class="sidebar"></div>
    <div class="content container-fluid">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>IT Assets</h3>
        <div>
          <a class="btn btn-primary" href="/frontend/admin/add-asset.html">Add Asset</a>
          <a class="btn btn-outline-secondary" href="/frontend/admin/import-csv.html">Import CSV</a>
        </div>
      </div>

      <div id="assets-error" class="alert alert-danger d-none" role="alert"></div>
      <table id="assets-table" class="table table-striped" style="width:100%">
        <thead><tr><th>Asset ID</th><th>Name</th><th>Category</th><th>Brand</th><th>Model</th><th>Serial</th><th>Location</th><th>Assigned</th><th>Status</th><th>Warranty</th><th>Actions</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.5/js/jquery.dataTables.min.js"></script>
    <script src="/frontend/assets/js/auth.js"></script>
    <script>
      $(document).ready(function(){
        const table = $('#assets-table').DataTable({data:[],columns:[
          {data:'asset_code'},
          {data:'asset_name'},
          {data:'asset_categories.name',defaultContent:'—'},
          {data:'brand',defaultContent:'—'},
          {data:'model',defaultContent:'—'},
          {data:'serial_number',defaultContent:'—'},
          {data:'locations.name',defaultContent:'—'},
          {data:'users.full_name',defaultContent:'—'},
          {data:'status',defaultContent:'—'},
          {data:'warranty_end',defaultContent:'—'},
          {data:null,orderable:false,searchable:false,render:(asset)=>`<div class="table-actions"><a class="btn btn-sm btn-primary" href="/frontend/admin/asset-details.html?id=${encodeURIComponent(asset.id)}">View</a> <button class="btn btn-sm btn-outline-secondary qr-button" data-id="${encodeURIComponent(asset.id)}">QR</button></div>`}
        ]})
        DBASCAuth.authorizedFetch('/api/assets')
          .then(async response => {
            const result = await response.json()
            if (!response.ok || !result.success) throw new Error(result.message || 'Unable to load assets.')
            table.clear().rows.add(result.data || []).draw()
          })
          .catch(error => {
            const errorBox = document.getElementById('assets-error')
            errorBox.textContent = error.message
            errorBox.classList.remove('d-none')
          })
        $('#assets-table').on('click','.qr-button',async function(){
          const id = this.dataset.id
          try {
            const response = await DBASCAuth.authorizedFetch(`/api/assets/${encodeURIComponent(id)}?action=qr`,{method:'POST'})
            const result = await response.json()
            if (!response.ok || !result.success) throw new Error(result.message || 'Unable to create QR code.')
            const image = new Image()
            image.src = result.data
            image.alt = 'Asset QR code'
            image.style.maxWidth = '100%'
            const modal = document.createElement('div')
            modal.className = 'alert alert-light position-fixed top-50 start-50 translate-middle shadow'
            modal.style.zIndex = '1100'
            modal.append(image)
            modal.addEventListener('click',() => modal.remove())
            document.body.append(modal)
          } catch(error) {
            const errorBox = document.getElementById('assets-error')
            errorBox.textContent = error.message
            errorBox.classList.remove('d-none')
          }
        })
      })
    </script>
    <script src="/frontend/assets/js/logo.js?v=1"></script>
  </body>
  </html>
