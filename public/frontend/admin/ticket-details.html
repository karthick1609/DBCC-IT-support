<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ticket Details - DBASC IT SUPPORT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/frontend/assets/css/style.css?v=college-logo-18" rel="stylesheet">
  </head>
  <body>
    <div class="topbar"><div class="container-fluid d-flex align-items-center"><h5 class="text-white mb-0">Ticket Details</h5></div></div>
    <div class="sidebar"></div>
    <div class="content container-fluid">
      <div class="card p-3 mb-3">
        <div class="d-flex justify-content-between"><h4 id="ticket-id">Ticket</h4><span id="ticket-status" class="badge bg-secondary">—</span></div>
        <p id="ticket-title"></p>
        <div id="ticket-status-actions" class="d-flex gap-2 mb-3 d-none">
          <button id="accept-ticket-button" class="btn btn-success" type="button">Accept</button>
          <button id="complete-ticket-button" class="btn btn-outline-success" type="button">Mark Completed</button>
        </div>
        <div id="ticket-status-message" class="alert d-none" role="status"></div>
        <div class="row">
          <div class="col-md-6">
            <div><strong>Requester:</strong> <span id="ticket-requester">—</span></div>
            <div><strong>Department:</strong> <span id="ticket-department">—</span></div>
            <div><strong>Location:</strong> <span id="ticket-location">—</span></div>
          </div>
          <div class="col-md-6 text-end">
            <div><strong>Priority:</strong> <span id="ticket-priority">—</span></div>
            <div><strong>Created:</strong> <span id="ticket-created">—</span></div>
          </div>
        </div>
        <p id="ticket-description" class="mt-3 mb-0"></p>
      </div>

      <div class="card p-3 mb-3">
        <h5>Conversation</h5>
        <div id="ticket-comments" class="mb-3"></div>

        <form id="replyForm" class="mt-3 d-flex">
          <input id="reply-message" class="form-control me-2" placeholder="Write a reply..." required>
          <button class="btn btn-primary" type="submit">Send</button>
        </form>
      </div>
    </div>
    <div id="ticket-error" class="alert alert-danger d-none position-fixed bottom-0 end-0 m-3" role="alert"></div>
    <script src="/frontend/assets/js/auth.js?v=role-pages-2"></script>
    <script>
      const ticketId = new URLSearchParams(location.search).get('id')
      const errorBox = document.getElementById('ticket-error')
      const session = DBASCAuth.getSession()
      function showTicketError(error) {
        errorBox.textContent = error.message
        errorBox.classList.remove('d-none')
      }
      function renderComments(comments) {
        const list = document.getElementById('ticket-comments')
        list.replaceChildren()
        if (!comments.length) {
          list.textContent = 'No replies yet.'
          return
        }
        comments.forEach(comment => {
          const item = document.createElement('div')
          item.className = 'message-row d-flex mb-3'
          const text = document.createElement('div')
          const name = document.createElement('strong')
          name.textContent = comment.users?.full_name || 'User'
          const content = document.createElement('div')
          content.textContent = comment.message
          const date = document.createElement('small')
          date.className = 'text-muted'
          date.textContent = new Date(comment.created_at).toLocaleString()
          text.append(name, content, date)
          item.append(text)
          list.append(item)
        })
      }
      async function loadTicket() {
        if (!ticketId) throw new Error('Ticket id is missing.')
        const response = await DBASCAuth.authorizedFetch(`/api/tickets/${encodeURIComponent(ticketId)}`)
        const result = await response.json()
        if (!response.ok || !result.success) throw new Error(result.message || 'Unable to load ticket.')
        const {ticket, comments} = result.data
        document.getElementById('ticket-id').textContent = ticket.ticket_number
        document.getElementById('ticket-title').textContent = ticket.title
        document.getElementById('ticket-status').textContent = ticket.status
        const actions = document.getElementById('ticket-status-actions')
        if (session?.role === 'admin') {
          actions.classList.remove('d-none')
          document.getElementById('accept-ticket-button').classList.toggle('d-none', ticket.status !== 'Open')
          document.getElementById('complete-ticket-button').classList.toggle('d-none', ticket.status !== 'In Progress')
        } else {
          actions.classList.add('d-none')
        }
        document.getElementById('ticket-priority').textContent = ticket.priority
        document.getElementById('ticket-requester').textContent = ticket.requester?.full_name || '—'
        document.getElementById('ticket-department').textContent = ticket.departments?.name || '—'
        document.getElementById('ticket-location').textContent = ticket.locations?.name || '—'
        document.getElementById('ticket-created').textContent = new Date(ticket.created_at).toLocaleString()
        document.getElementById('ticket-description').textContent = ticket.description || ''
        renderComments(comments || [])
      }
      loadTicket().catch(showTicketError)
      async function updateTicketStatus(status) {
        const message = document.getElementById('ticket-status-message')
        const buttons = document.querySelectorAll('#ticket-status-actions button')
        message.className = 'alert d-none'
        buttons.forEach(button => { button.disabled = true })
        try {
          const response = await DBASCAuth.authorizedFetch(`/api/tickets/${encodeURIComponent(ticketId)}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ status })
          })
          const result = await response.json()
          if (!response.ok || !result.success) throw new Error(result.message || 'Unable to update ticket status.')
          message.textContent = `Ticket is now ${result.data.status}.`
          message.className = 'alert alert-success'
          await loadTicket()
        } catch (error) {
          message.textContent = error.message
          message.className = 'alert alert-danger'
        } finally {
          buttons.forEach(button => { button.disabled = false })
        }
      }
      document.getElementById('accept-ticket-button').addEventListener('click', () => updateTicketStatus('In Progress'))
      document.getElementById('complete-ticket-button').addEventListener('click', () => updateTicketStatus('Completed'))
      document.getElementById('replyForm').addEventListener('submit', async event => {
        event.preventDefault()
        const button = event.currentTarget.querySelector('button')
        button.disabled = true
        try {
          const response = await DBASCAuth.authorizedFetch(`/api/tickets/${encodeURIComponent(ticketId)}?action=comment`, {
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({message:document.getElementById('reply-message').value})
          })
          const result = await response.json()
          if (!response.ok || !result.success) throw new Error(result.message || 'Unable to add reply.')
          document.getElementById('reply-message').value = ''
          await loadTicket()
        } catch(error) {
          showTicketError(error)
        } finally {
          button.disabled = false
        }
      })
    </script>
    <script src="/frontend/assets/js/logo.js?v=1"></script>
  </body>
  </html>
