<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Users - DBASC IT SUPPORT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/1.13.5/css/jquery.dataTables.min.css" rel="stylesheet">
    <link href="/frontend/assets/css/style.css" rel="stylesheet">
  </head>
  <body>
    <div class="topbar"><div class="container-fluid d-flex align-items-center"><h5 class="text-white mb-0">Users</h5></div></div>
    <div class="sidebar"></div>
    <div class="content container-fluid">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>Users</h3>
      </div>
      <div id="users-error" class="alert alert-danger d-none" role="alert"></div>
      <table id="users-table" class="table table-striped" style="width:100%">
        <thead><tr><th>Name</th><th>Email</th><th>Department</th><th>Role</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.5/js/jquery.dataTables.min.js"></script>
    <script src="/frontend/assets/js/auth.js"></script>
    <script>
      $(document).ready(async function(){
        try {
          const response = await DBASCAuth.authorizedFetch('/api/users')
          const result = await response.json()
          if (!response.ok || !result.success) throw new Error(result.message || 'Unable to load users.')
          const users = (result.data || []).map(user => ({
            name: user.full_name,
            email: user.email,
            department: user.department ? user.department.name : '—',
            role: user.role,
            status: user.status
          }))
          $('#users-table').DataTable({
            data: users,
            columns: [
              { data: 'name' },
              { data: 'email' },
              { data: 'department' },
              { data: 'role' },
              { data: 'status' },
              { data: null, orderable: false, searchable: false, render: () => '<span class="text-muted">—</span>' }
            ]
          })
        } catch (error) {
          const errorBox = document.getElementById('users-error')
          errorBox.textContent = error.message
          errorBox.classList.remove('d-none')
        }
      })
    </script>
  </body>
  </html>
