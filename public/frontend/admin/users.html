<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Users - DBASC IT SUPPORT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/1.13.5/css/jquery.dataTables.min.css" rel="stylesheet">
    <link href="/frontend/assets/css/style.css" rel="stylesheet">
  </head>
  <body>
    <div class="topbar"><div class="container-fluid d-flex align-items-center"><h5 class="text-white mb-0">Users</h5></div></div>
    <div class="sidebar"></div>
    <div class="content container-fluid">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>Users</h3>
        <a class="btn btn-primary">Add User</a>
      </div>
      <table id="users-table" class="table table-striped" style="width:100%">
        <thead><tr><th>Name</th><th>Email</th><th>Department</th><th>Role</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.5/js/jquery.dataTables.min.js"></script>
    <script>
      const mockUsers = []
      for(let i=1;i<=10;i++) mockUsers.push({name:`User ${i}`,email:`user${i}@example.com`,department:['BCA','B.Com','Viscom'][i%3],role:['staff','admin','principal'][i%3],status:'active'})
      $(document).ready(()=>{ $('#users-table').DataTable({data:mockUsers,columns:[{data:'name'},{data:'email'},{data:'department'},{data:'role'},{data:'status'},{data:null,render:()=>`<button class='btn btn-sm btn-primary'>View</button>`}]}) })
    </script>
  </body>
  </html>
