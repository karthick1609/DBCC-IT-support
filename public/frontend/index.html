<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DBASC IT SUPPORT - Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/frontend/assets/css/style.css?v=college-logo-9" rel="stylesheet">
  </head>
<body>
    <div class="topbar">
      <div class="topbar-left">
        <div class="navbar-brand">
          <span class="brand-mark"><i class="bi bi-laptop"></i></span>
          <span>DBASC IT SUPPORT</span>
        </div>
      </div>

      <div class="topbar-right">
        <div id="welcome-user" class="user-pill"><span class="user-dot"></span> Welcome</div>
        <div class="user-pill"><span>Role:</span> <strong id="nav-role">ADMIN</strong></div>

        <button id="theme-toggle" class="theme-toggle" type="button"><i class="bi bi-moon-stars"></i> Dark</button>
        <button id="logout-button" class="logout-btn" type="button"><i class="bi bi-box-arrow-right"></i> Logout</button>
      </div>
    </div>

    <div class="sidebar">
      <div class="sidebar-header">
        <h6>Menu</h6>
      </div>
      <ul class="nav flex-column">
        <li class="nav-item"><a class="nav-link active" href="/frontend/admin/dashboard.html" data-role="admin,staff,principal"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" href="/frontend/admin/assets.html" data-role="admin,principal"><i class="bi bi-pc-display"></i> Assets</a></li>
        <li class="nav-item"><a class="nav-link" href="/frontend/admin/tickets.html" data-role="admin,staff,principal"><i class="bi bi-ticket-detailed"></i> Tickets</a></li>
        <li class="nav-item"><a class="nav-link" href="/frontend/admin/users.html" data-role="admin"><i class="bi bi-people"></i> Users</a></li>
        <li class="nav-item"><a class="nav-link" href="/frontend/admin/reports.html" data-role="admin,principal"><i class="bi bi-graph-up-arrow"></i> Reports</a></li>
      </ul>
    </div>

    <div class="content">
      <div class="container-fluid">
        <div class="page-header network-hero">
          <div>
            <span class="network-eyebrow"><span class="user-dot"></span> IT OPERATIONS / SERVICE DESK</span>
            <h2>Welcome to DBASC IT SUPPORT</h2>
            <p>Manage support requests and IT resources from one place.</p>
          </div>
          <span class="badge-soft-primary"><i class="bi bi-diagram-3"></i> System Overview</span>
        </div>

        <div class="card card-stats">
          <div class="card p-3">
            <h6><i class="bi bi-pc-display-horizontal"></i> Total Assets</h6>
            <h3 id="total-assets">—</h3>
          </div>
          <div class="card p-3">
            <h6><i class="bi bi-broadcast-pin"></i> Open Tickets</h6>
            <h3 id="open-tickets">—</h3>
          </div>
          <div class="card p-3">
            <h6><i class="bi bi-arrow-repeat"></i> In Progress</h6>
            <h3 id="inprogress">—</h3>
          </div>
          <div class="card p-3">
            <h6><i class="bi bi-check2-circle"></i> Resolved</h6>
            <h3 id="resolved">—</h3>
          </div>
        </div>
        <div id="dashboard-error" class="alert alert-danger d-none" role="alert"></div>

      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/frontend/assets/js/auth.js"></script>
    <script>
      DBASCAuth.authorizedFetch('/api/reports?type=dashboard-summary')
        .then(async response=>{
          const result=await response.json()
          if(!response.ok||!result.success) throw new Error(result.message||'Unable to load dashboard.')
          document.getElementById('total-assets').textContent=result.data.assets_total
          document.getElementById('open-tickets').textContent=result.data.tickets_by_status.Open||0
          document.getElementById('inprogress').textContent=result.data.tickets_by_status['In Progress']||0
          document.getElementById('resolved').textContent=result.data.tickets_by_status.Resolved||0
        })
        .catch(error=>{
          const box=document.getElementById('dashboard-error')
          box.textContent=error.message
          box.classList.remove('d-none')
        })
    </script>
    <script src="/frontend/assets/js/logo.js?v=1"></script>
  </body>
  </html>
