<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Staff Dashboard - DBASC IT SUPPORT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/frontend/assets/css/style.css?v=college-logo-18" rel="stylesheet">
  </head>
  <body>
    <div class="topbar"><div class="container-fluid d-flex align-items-center"><h5 class="text-white mb-0">Staff Dashboard</h5></div></div>
    <div class="sidebar"></div>
    <div class="content">
      <div class="network-hero page-header">
        <div>
          <span class="network-eyebrow"><span class="user-dot"></span> IT OPERATIONS / SERVICE DESK</span>
          <h2 id="staff-welcome">Welcome</h2>
          <p>Manage support requests and follow their progress.</p>
        </div>
        <span class="badge-soft-primary"><i class="bi bi-headset"></i> Staff workspace</span>
      </div>
      <div class="card-stats">
        <div class="card p-3"><h6><i class="bi bi-broadcast-pin"></i> My Open Tickets</h6><h3 id="staff-open">—</h3></div>
        <div class="card p-3"><h6><i class="bi bi-arrow-repeat"></i> In Progress</h6><h3 id="staff-progress">—</h3></div>
        <div class="card p-3"><h6><i class="bi bi-check2-circle"></i> Completed</h6><h3 id="staff-completed">—</h3></div>
        <div class="card p-3"><h6><i class="bi bi-archive"></i> Closed</h6><h3 id="staff-closed">—</h3></div>
      </div>
      <div id="dashboard-error" class="alert alert-danger d-none mt-3" role="alert"></div>
      <div class="mt-4"><a class="btn btn-primary" href="/frontend/staff/create-ticket.html">+ Create New Ticket</a></div>
    </div>
    <script src="/frontend/assets/js/auth.js?v=role-pages-2"></script>
    <script>
      const session=DBASCAuth.getSession()
      if(session) document.getElementById('staff-welcome').textContent=`Welcome, ${session.name}`
      DBASCAuth.authorizedFetch('/api/reports?type=dashboard-summary')
        .then(async response=>{
          const result=await response.json()
          if(!response.ok||!result.success) throw new Error(result.message||'Unable to load dashboard.')
          const statuses=result.data.tickets_by_status
          document.getElementById('staff-open').textContent=statuses.Open||0
          document.getElementById('staff-progress').textContent=statuses['In Progress']||0
          document.getElementById('staff-completed').textContent=statuses.Completed||statuses.Resolved||0
          document.getElementById('staff-closed').textContent=statuses.Closed||0
        })
        .catch(error=>{
          const box=document.getElementById('dashboard-error')
          box.textContent=error.message
          box.classList.remove('d-none')
        })
    </script>
    <script src="/frontend/assets/js/logo.js?v=1"></script>
  </body>
  </html>
