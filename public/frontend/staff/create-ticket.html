<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create Ticket - DBASC IT SUPPORT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/frontend/assets/css/style.css" rel="stylesheet">
  </head>
  <body>
    <div class="topbar"><div class="container-fluid d-flex align-items-center"><h5 class="text-white mb-0">Create Ticket</h5></div></div>
    <div class="sidebar"></div>
    <div class="content container-fluid">
      <form id="ticketForm" class="card p-3">
        <div class="mb-3"><label>Title</label><input class="form-control" name="title" required></div>
        <div class="mb-3"><label>Description</label><textarea class="form-control" name="description" rows="4" required></textarea></div>
        <div class="row">
          <div class="col-md-4 mb-3"><label>Category</label><select class="form-select" name="category"><option>Network</option><option>Internet</option></select></div>
          <div class="col-md-4 mb-3"><label>Priority</label><select class="form-select" name="priority"><option>Low</option><option>Medium</option><option>High</option><option>Critical</option></select></div>
          <div class="col-md-4 mb-3"><label>Location</label><select class="form-select" name="location"><option>Lab 1</option><option>Lab 2</option></select></div>
        </div>
        <div class="mb-3"><label>Attachment</label><input type="file" class="form-control" name="attachment"></div>
        <div class="d-flex justify-content-end"><button class="btn btn-primary" type="submit">Submit Ticket</button></div>
      </form>
    </div>
    <script>
      document.getElementById('ticketForm').addEventListener('submit', e=>{ e.preventDefault(); alert('Ticket DB-HD-000125 created successfully (mock).') })
    </script>
  </body>
  </html>
