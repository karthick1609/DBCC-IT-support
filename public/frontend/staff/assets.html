<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Assets Overview - DBASC IT SUPPORT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/frontend/assets/css/style.css?v=college-logo-18" rel="stylesheet">
  </head>
  <body>
    <div class="topbar"><div class="container-fluid d-flex align-items-center"><h5 class="text-white mb-0">Assets Overview</h5></div></div>
    <div class="sidebar"></div>
    <main class="content container-fluid">
      <div class="network-hero page-header">
        <div>
          <span class="network-eyebrow"><span class="user-dot"></span> STAFF / IT INVENTORY</span>
          <h2>Assets overview</h2>
          <p>Browse college IT equipment and its current status.</p>
        </div>
        <span class="badge-soft-primary"><i class="bi bi-pc-display"></i> Read-only inventory</span>
      </div>
      <div id="staff-assets-error" class="alert alert-danger d-none" role="alert"></div>
      <section class="card p-3">
        <div class="table-responsive">
          <table class="table table-striped align-middle mb-0">
            <thead><tr><th>Asset ID</th><th>Asset</th><th>Category</th><th>Location</th><th>Status</th></tr></thead>
            <tbody id="staff-assets-body"><tr><td colspan="5" class="text-muted text-center py-4">Loading assets…</td></tr></tbody>
          </table>
        </div>
      </section>
    </main>
    <script src="/frontend/assets/js/auth.js?v=role-pages-2"></script>
    <script>
      async function loadAssets() {
        const body = document.getElementById('staff-assets-body')
        const errorBox = document.getElementById('staff-assets-error')
        try {
          const response = await DBASCAuth.authorizedFetch('/api/assets')
          const result = await response.json()
          if (!response.ok || !result.success) throw new Error(result.message || 'Unable to load assets.')
          const assets = result.data || []
          body.replaceChildren()
          if (!assets.length) {
            const row = body.insertRow()
            const cell = row.insertCell()
            cell.colSpan = 5
            cell.className = 'text-muted text-center py-4'
            cell.textContent = 'No assets are available.'
            return
          }
          assets.forEach(asset => {
            const row = body.insertRow()
            ;[
              asset.asset_code,
              asset.asset_name,
              asset.asset_categories && asset.asset_categories.name,
              asset.locations && asset.locations.name,
              asset.status
            ].forEach(value => {
              row.insertCell().textContent = value || '—'
            })
          })
        } catch (error) {
          errorBox.textContent = error.message
          errorBox.classList.remove('d-none')
          body.replaceChildren()
          const row = body.insertRow()
          const cell = row.insertCell()
          cell.colSpan = 5
          cell.className = 'text-muted text-center py-4'
          cell.textContent = 'Asset list could not be loaded.'
        }
      }
      loadAssets()
    </script>
    <script src="/frontend/assets/js/logo.js?v=1"></script>
  </body>
</html>
