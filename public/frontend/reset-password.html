<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset Password - DBASC IT SUPPORT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/frontend/assets/css/style.css?v=college-logo-17" rel="stylesheet">
  </head>
  <body class="auth-page">
    <main class="auth-shell">
      <section class="auth-card auth-reset-card" aria-labelledby="reset-title">
        <header class="auth-brand">
          <span class="auth-brand-label">ACCOUNT RECOVERY</span>
          <h1>DBASC IT SUPPORT</h1>
          <small>Set a new password for your account.</small>
        </header>
        <div class="auth-card-body">
          <h2 id="reset-title" class="auth-form-heading">Reset password</h2>
          <p class="text-muted">Choose a new password with at least 8 characters.</p>
          <form id="reset-password-form">
            <div class="mb-3">
              <label for="new-password" class="form-label">New password</label>
              <input id="new-password" type="password" class="form-control" autocomplete="new-password" minlength="8" required>
            </div>
            <div class="mb-3">
              <label for="confirm-new-password" class="form-label">Confirm new password</label>
              <input id="confirm-new-password" type="password" class="form-control" autocomplete="new-password" minlength="8" required>
            </div>
            <div id="reset-password-message" class="alert d-none" role="alert"></div>
            <button type="submit" class="btn btn-primary w-100">Update password</button>
          </form>
          <p class="text-center mt-4 mb-0"><a href="/frontend/login.html">Back to sign in</a></p>
        </div>
      </section>
    </main>
    <script src="/frontend/assets/js/auth.js"></script>
    <script src="/frontend/assets/js/logo.js?v=1"></script>
  </body>
</html>
